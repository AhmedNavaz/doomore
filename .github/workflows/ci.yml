name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          xcodebuild -project FocusAssistant.xcodeproj -scheme FocusAssistant \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData test
